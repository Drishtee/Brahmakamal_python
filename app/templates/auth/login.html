<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brahmakamal Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2, #ff6a88);
      background-size: 300% 300%;
      animation: gradientMove 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 900px;
      max-width: 95%;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }

    .left {
      flex: 1;
      padding: 50px;
      background: linear-gradient(135deg, #1D9E75, #3a7bd5);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .left h1 {
      margin: 0;
      font-size: 34px;
    }

    .left p {
      margin-top: 10px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .right {
      flex: 1;
      padding: 50px;
    }

    .right h2 {
      margin-bottom: 25px;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #1D9E75;
      box-shadow: 0 0 0 2px rgba(29,158,117,0.2);
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #1D9E75, #3a7bd5);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error {
      background: #ffe6e6;
      color: #cc0000;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .footer {
      font-size: 12px;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left {
        padding: 30px;
        text-align: center;
      }

      .right {
        padding: 30px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">
    <div>
      <h1>Brahmakamal</h1>
      <p>
        Explore India's geographical insights.
        Access villages, routes and administrative data seamlessly.
      </p>
    </div>

    <div class="footer">
      © 2026 Drishtee Foundation
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <h2>Sign in to your account</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/auth/login">

      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button class="btn" type="submit">Login</button>

    </form>
  </div>

</div>

</body>
</html>
